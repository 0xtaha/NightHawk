# The complete list of what this role changes is in docs/08-ansible.md. Nothing else is touched.
- name: Choose names that differ between distribution families
  ansible.builtin.set_fact:
    hardening_sshd_service: "{{ 'sshd' if ansible_facts['os_family'] == 'RedHat' else 'ssh' }}"
    hardening_time_package: "{{ 'chrony' if ansible_facts['os_family'] == 'RedHat' else 'systemd-timesyncd' }}"
    hardening_time_service: "{{ 'chronyd' if ansible_facts['os_family'] == 'RedHat' else 'systemd-timesyncd' }}"

- name: Refresh the package index (Debian family)
  # The one step that also runs in check mode: without an index no package can be looked up.
  ansible.builtin.apt:
    update_cache: true
    # Skipped while the index is younger than a day; a host without one always gets it.
    cache_valid_time: 86400
  when: ansible_facts['os_family'] == 'Debian'
  check_mode: false
  changed_when: false

- name: Configure SSH
  ansible.builtin.import_tasks: ssh.yml

- name: Create the directory kernel settings are read from
  # A minimal installation of the RHEL family does not have it.
  ansible.builtin.file:
    path: "{{ hardening_sysctl_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the kernel network settings for this host's role
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: "{{ hardening_sysctl_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Load kernel settings

- name: Install the time synchronization service
  ansible.builtin.package:
    name: "{{ hardening_time_package }}"
    state: present
  register: hardening_time_installed

- name: Enable time synchronization
  ansible.builtin.service:
    name: "{{ hardening_time_service }}"
    enabled: true
    # A container shares its host's clock and the service declines to start there.
    state: "{{ omit if ansible_facts['virtualization_type'] in ['podman', 'docker', 'container', 'lxc'] else 'started' }}"
  # In a dry run the package was not installed, so there is no service to look at yet.
  when: not (ansible_check_mode and hardening_time_installed is changed)

- name: Configure automatic security updates
  ansible.builtin.import_tasks: updates.yml
  when: hardening_automatic_security_updates | bool
