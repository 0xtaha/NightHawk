- name: Harden a Docker host
  hosts: all
  gather_facts: true
  vars_files:
    - "{{ nighthawk_inputs_file }}"
  vars:
    nighthawk_host_role: docker_host
    hardening_ssh_user: root
    # A container cannot load host kernel settings; the file is still written and checked.
    hardening_apply_sysctl_now: false
  roles:
    - role: hardening
