- name: Create the directory k3s applies manifests from
  ansible.builtin.file:
    path: "{{ cilium_manifest_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Place the cluster network's chart, pinned, with this cluster's ranges
  ansible.builtin.template:
    src: nighthawk-cilium.yaml.j2
    dest: "{{ cilium_manifest_dir }}/nighthawk-cilium.yaml"
    owner: root
    group: root
    mode: "0600"
