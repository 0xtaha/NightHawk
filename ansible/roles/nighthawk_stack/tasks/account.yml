- name: Create the stack's group with the rendered GID
  ansible.builtin.group:
    name: "{{ nighthawk_stack_user }}"
    gid: "{{ nighthawk_stack_environment.NIGHTHAWK_GID | int }}"

- name: Create the stack's account with the rendered UID
  ansible.builtin.user:
    name: "{{ nighthawk_stack_user }}"
    uid: "{{ nighthawk_stack_environment.NIGHTHAWK_UID | int }}"
    group: "{{ nighthawk_stack_user }}"
    home: "{{ nighthawk_stack_dir }}"
    create_home: false
    shell: /usr/sbin/nologin
    password: "!"

- name: Install what unpacking the image source needs
  ansible.builtin.package:
    name: tar
    state: present

- name: Create the stack's directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ nighthawk_stack_dir }}", owner: root, mode: "0755"}
    - {path: "{{ nighthawk_stack_rendered_target }}", owner: root, mode: "0755"}
    # Secret files are for the account the containers run as, and nobody else.
    - {path: "{{ nighthawk_stack_secrets_target }}", owner: "{{ nighthawk_stack_user }}", mode: "0700"}
  loop_control:
    label: "{{ item.path }}"
