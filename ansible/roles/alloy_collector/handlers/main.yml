# A restart also reads the configuration, so a reload after it would only lose time.
- name: Restart the collector
  ansible.builtin.systemd_service:
    name: "{{ alloy_collector_unit }}"
    state: restarted
    daemon_reload: true
  when:
    - alloy_collector_manage_service | bool
    # In a dry run on a new host the unit was not installed, so there is nothing to restart.
    - not (ansible_check_mode and alloy_collector_unit_file is changed)
  register: alloy_collector_restarted

- name: Reload the collector
  ansible.builtin.systemd_service:
    name: "{{ alloy_collector_unit }}"
    state: reloaded
  when:
    - alloy_collector_manage_service | bool
    - not (ansible_check_mode and alloy_collector_unit_file is changed)
    - alloy_collector_restarted is not defined or alloy_collector_restarted is not changed
