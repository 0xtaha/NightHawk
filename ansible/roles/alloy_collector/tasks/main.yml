# Everything that can refuse does so in inputs.yml, before the host is changed.
- name: Obtain the certificate and check what was rendered
  ansible.builtin.import_tasks: inputs.yml

- name: Install the pinned collector
  ansible.builtin.import_tasks: install.yml

- name: Create the account, the directories, and the unit
  ansible.builtin.import_tasks: service.yml

- name: Copy the credential, the certificate, and the configuration
  ansible.builtin.import_tasks: files.yml

- name: Run the handlers before starting, so a first start is not followed by a restart
  ansible.builtin.meta: flush_handlers

- name: Start the collector and enable it at boot
  ansible.builtin.systemd_service:
    name: "{{ alloy_collector_unit }}"
    enabled: true
    state: started
    daemon_reload: true
  when:
    - alloy_collector_manage_service | bool
    - not (ansible_check_mode and alloy_collector_unit_file is changed)
