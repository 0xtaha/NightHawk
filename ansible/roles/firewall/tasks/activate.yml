# Reached only when the rules differ from what is in force. The previous state is saved and
# a timer is armed to restore it; the timer is cancelled only after a fresh connection works.
- name: Save the firewall state that is in force now
  ansible.builtin.command:
    cmd: "{{ firewall_script_dir }}/nighthawk-firewall-rollback --save"
  changed_when: true

- name: Arm the automatic restore
  ansible.builtin.command:
    cmd: >-
      systemd-run --unit nighthawk-firewall-rollback --collect
      --on-active={{ firewall_rollback_minutes | int }}m
      {{ firewall_script_dir }}/nighthawk-firewall-rollback --restore
  changed_when: true

- name: Apply the rules
  ansible.builtin.command:
    cmd: "{{ firewall_script_dir }}/nighthawk-firewall-apply"
  changed_when: true

- name: Limit the container runtime's published ports
  ansible.builtin.systemd_service:
    name: nighthawk-firewall-docker.service
    daemon_reload: true
    enabled: true
    state: restarted
  when: nighthawk_host_role == 'docker_host'

- name: Drop the connection that predates the rules
  ansible.builtin.meta: reset_connection

- name: Prove that a new connection still gets in
  ansible.builtin.wait_for_connection:
    timeout: "{{ (firewall_rollback_minutes | int) * 60 - 30 }}"

- name: Cancel the automatic restore
  ansible.builtin.systemd_service:
    name: nighthawk-firewall-rollback.timer
    state: stopped

- name: Make the rules permanent
  ansible.builtin.command:
    cmd: "{{ firewall_script_dir }}/nighthawk-firewall-apply --persist"
  changed_when: true

- name: Record the plan as the one in force
  ansible.builtin.copy:
    content: "{{ firewall_plan | to_nice_json(indent=2) }}\n"
    dest: "{{ firewall_state_dir }}/active-plan.json"
    owner: root
    group: root
    mode: "0600"
