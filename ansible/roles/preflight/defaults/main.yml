# The role this host is judged for. Inventories set nighthawk_host_role per group.
preflight_host_role: "{{ nighthawk_host_role }}"

# What this host reports, in the terms the compatibility matrix uses. Derived from gathered facts.
preflight_reported_distribution: "{{ ansible_facts['distribution'] | lower }}"
preflight_reported_versions:
  - "{{ ansible_facts['distribution_version'] }}"
  - "{{ ansible_facts['distribution_major_version'] }}"
preflight_reported_architecture: >-
  {{ {'x86_64': 'amd64', 'amd64': 'amd64', 'aarch64': 'arm64', 'arm64': 'arm64'}
     .get(ansible_facts['architecture'], ansible_facts['architecture']) }}
