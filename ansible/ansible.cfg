# Run every ansible command from this directory.
[defaults]
inventory = inventories
roles_path = roles
collections_path = .collections
# Only the collections in requirements.yml, at the versions pinned there.
collections_scan_sys_path = False
stdout_callback = ansible.builtin.default
result_format = yaml
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
# A task that handles a secret sets no_log itself; nothing here turns logging of secrets on.
display_args_to_stdout = False

[ssh_connection]
pipelining = True
