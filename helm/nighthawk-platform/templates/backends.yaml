{{- if .Values.enabled.backends }}
{{- range $name, $backend := .Values.backends }}
---
# Monolithic {{ $name }} for the development profile, with the configuration the Compose
# profile verified. Production uses the upstream distributed chart instead.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "nighthawk.labels" $ | nindent 4 }}
spec:
  selector: {{- include "nighthawk.component" $name | nindent 4 }}
  ports:
    {{- range $backend.ports }}
    - {name: {{ .name }}, port: {{ .port }}, targetPort: {{ .port }}}
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "nighthawk.labels" $ | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: {{- include "nighthawk.component" $name | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nighthawk.labels" $ | nindent 8 }}
        {{- include "nighthawk.component" $name | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- include "nighthawk.podSecurity" $ | nindent 6 }}
      containers:
        - name: {{ $name }}
          image: {{ index $.Values.images $name | quote }}
          args: {{- toYaml $backend.args | nindent 12 }}
          env:
            # The storage authority. Go reads it instead of the system bundle; backends only call storage.
            - {name: SSL_CERT_FILE, value: /etc/nighthawk/storage/ca.pem}
          envFrom:
            - secretRef:
                name: {{ include "nighthawk.secretName" (dict "workload" $name "ref" $backend.identity) }}
          ports:
            {{- range $backend.ports }}
            - {name: {{ .name }}, containerPort: {{ .port }}}
            {{- end }}
          readinessProbe:
            httpGet: {path: /ready, port: {{ $backend.readyPort }}}
            periodSeconds: 5
            failureThreshold: 60
          {{- include "nighthawk.containerSecurity" $ | nindent 10 }}
          resources: {{- toYaml (index $.Values.resources $name | default dict) | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: {{ $backend.dataDir }}}
            - {name: config, mountPath: /etc/nighthawk/contracts/backends, readOnly: true}
            - {name: overrides, mountPath: /etc/nighthawk/overrides, readOnly: true}
            - {name: storage-ca, mountPath: /etc/nighthawk/storage, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: nighthawk-backends}
        - name: overrides
          configMap: {name: nighthawk-overrides}
        - name: storage-ca
          secret:
            secretName: storage-server-tls
            items: [{key: ca.crt, path: ca.pem}]
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $.Values.storage.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $backend.size }}
{{- end }}
{{- end }}
