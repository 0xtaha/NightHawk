{{- if .Values.enabled.provision }}
# Reconciles Grafana's organizations and data sources with the rendered desired state. It
# sends only differences, so running it again changes nothing.
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-provision
  labels: {{- include "nighthawk.labels" . | nindent 4 }}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "nighthawk.labels" . | nindent 8 }}
        {{- include "nighthawk.component" "provisioner" | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: grafana-provisioner
      automountServiceAccountToken: false
      {{- include "nighthawk.podSecurity" . | nindent 6 }}
      containers:
        - name: provision
          image: {{ .Values.images.platform | quote }}
          args:
            - provision-grafana
            - --config=/etc/nighthawk/platform/platform.yaml
            - --url={{ .Values.grafana.url }}
            - --admin-user=admin
            - --admin-password-file=/run/nighthawk/secrets/kv/{{ .Values.grafana.adminSecret.path }}/{{ .Values.grafana.adminSecret.key }}
            - --secrets-dir=/run/nighthawk/secrets
            {{- range .Values.grafana.provisionArguments }}
            - {{ . | quote }}
            {{- end }}
          {{- include "nighthawk.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - {name: platform, mountPath: /etc/nighthawk/platform, readOnly: true}
            - {name: secrets, mountPath: /run/nighthawk/secrets/kv, readOnly: true}
      volumes:
        - name: platform
          configMap: {name: nighthawk-platform}
        {{- include "nighthawk.secretsVolume" (dict "root" . "name" "grafana-provisioner") | nindent 8 }}
{{- end }}
