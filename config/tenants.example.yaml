# Contract example, not deployment configuration. Retention values are examples.
schema_version: 2
deployment: docker
profile: development
vault:
  # A dev-mode Vault on this machine; see docs/00-quickstart.md. Credentials are never declared here.
  address: http://127.0.0.1:8200
  kv_mount: nighthawk-kv
  pki:
    mount: nighthawk-pki
    server_role: nighthawk-server
    client_role: nighthawk-collector
gateway:
  hostname: gateway.nighthawk.internal
  entry_points: [local-gateway, grafana-gateway]
  grafana_entry_point: grafana-gateway
  auth_service: http://authz:9180
  upstreams:
    grafana: http://grafana:3000
    metrics: http://mimir:8080
    logs: http://loki:3100
    traces:
      query: http://tempo:3200
      otlp_grpc: h2c://tempo:4317
      otlp_http: http://tempo:4318
    profiles: http://pyroscope:4040
  revoked_certificate_fingerprints: []
grafana:
  hostname: grafana.nighthawk.internal
  admin_secret_ref: grafana-admin
storage:
  provider: seaweedfs
  bindings:
    mimir-blocks: &mimir-binding
      protocol: s3
      endpoint: https://seaweedfs:8333
      region: local
      bucket: nighthawk-mimir-blocks
      force_path_style: true
      tls:
        enabled: true
        trust: pki
        ca_secret_ref: null
      identity:
        type: secret
        ref: mimir-storage
      capabilities:
        versioning: false
        lifecycle: false
        workload_identity: false
    mimir-ruler:
      <<: *mimir-binding
      bucket: nighthawk-mimir-ruler
    mimir-alertmanager:
      <<: *mimir-binding
      bucket: nighthawk-mimir-alertmanager
    loki-chunks:
      <<: *mimir-binding
      bucket: nighthawk-loki-chunks
      identity:
        type: secret
        ref: loki-storage
    tempo-traces:
      <<: *mimir-binding
      bucket: nighthawk-tempo-traces
      identity:
        type: secret
        ref: tempo-storage
    pyroscope-profiles:
      <<: *mimir-binding
      bucket: nighthawk-pyroscope-profiles
      identity:
        type: secret
        ref: pyroscope-storage
secrets:
  mimir-storage: {path: nighthawk/local, key: mimir-storage}
  loki-storage: {path: nighthawk/local, key: loki-storage}
  tempo-storage: {path: nighthawk/local, key: tempo-storage}
  pyroscope-storage: {path: nighthawk/local, key: pyroscope-storage}
  grafana-admin: {path: nighthawk/local, key: grafana-admin}
  example-ingest: {path: nighthawk/local, key: example-ingest}
  example-query: {path: nighthawk/local, key: example-query}
credentials:
  - id: example-ingest
    secret_ref: example-ingest
    tenant: example
    datastream: application
    permission: ingest
    certificate_identity: spiffe://nighthawk/example/application/collector
  - id: example-query
    secret_ref: example-query
    tenant: example
    datastream: application
    permission: query
tenants:
  - id: example
    datastreams:
      - id: application
        backend_id: example-application
        signals:
          metrics:
            retention: 168h
            ingestion_rate_samples_per_second: 10000
            query_concurrency: 4
          logs:
            retention: 72h
            ingestion_rate_bytes_per_second: 1048576
            query_concurrency: 4
          traces:
            retention: 72h
            ingestion_rate_bytes_per_second: 1048576
            query_concurrency: 4
          profiles:
            retention: 168h
            ingestion_rate_bytes_per_second: 1048576
            query_concurrency: 4
        collection:
          approved: true
          drop_fields: [password, authorization, cookie, email]
          allow_privileged_profiling: false
