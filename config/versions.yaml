# Source-verified compatibility matrix for every component the Docker,
# self-hosted Kubernetes, and AWS deployment profiles depend on.
# Not a complete deployment/image-digest lock; see versions.schema.json.
# runtime_verified: true means the component ran in the single-host Docker Compose stack
# under rootless Podman and passed tests/e2e (2026-10-09). It says nothing about the
# Kubernetes or distributed architectures, or about Docker Engine.
schema_version: 1
backends:
  mimir:
    version: 3.2.1
    source: https://github.com/grafana/mimir/releases/tag/mimir-3.2.1
    runtime_verified: true
    compose_architecture: classic
    production_architecture: ingest-storage
  loki:
    version: 3.7.8
    source: https://github.com/grafana/loki/releases/tag/v3.7.8
    runtime_verified: true
  tempo:
    version: 3.0.3
    source: https://github.com/grafana/tempo/releases/tag/v3.0.3
    runtime_verified: true
    compose_architecture: monolithic
    production_architecture: distributed-kafka
  pyroscope:
    version: 2.3.1
    source: https://github.com/grafana/pyroscope/releases/tag/v2.3.1
    runtime_verified: true
    storage: v2
    retention_override: retention_period
object_storage:
  provider: seaweedfs
  version: "4.47"
  source: https://github.com/seaweedfs/seaweedfs/releases/tag/4.47
  chart_version: 4.47.0
  chart_source: https://artifacthub.io/packages/helm/seaweedfs/seaweedfs
  runtime_verified: true
kubernetes_platform:
  k3s:
    version: 1.37.1+k3s1
    source: https://github.com/k3s-io/k3s/releases/tag/v1.37.1%2Bk3s1
    runtime_verified: false
  cilium:
    version: 1.20.2
    source: https://github.com/cilium/cilium/releases/tag/v1.20.2
    runtime_verified: false
  metallb:
    version: 0.16.1
    source: https://artifacthub.io/packages/helm/metallb/metallb
    runtime_verified: false
  longhorn:
    version: 1.13.0
    source: https://github.com/longhorn/longhorn/releases/tag/v1.13.0
    runtime_verified: false
  traefik:
    version: 3.7.13
    source: https://artifacthub.io/packages/helm/traefik/traefik
    runtime_verified: false
  cert_manager:
    version: 1.21.2
    source: https://github.com/cert-manager/cert-manager/releases/tag/v1.21.2
    runtime_verified: false
  strimzi:
    version: 1.2.0
    source: https://github.com/strimzi/strimzi-kafka-operator/releases/tag/1.2.0
    runtime_verified: false
    kafka_version: 4.3.1
    kafka_source: https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.2.0/kafka-versions.yaml
  eks:
    version: "1.37"
    source: https://docs.aws.amazon.com/eks/latest/userguide/kubernetes-versions-standard.html
    runtime_verified: false
  ebs_csi_driver:
    version: 1.66.0
    source: https://github.com/kubernetes-sigs/aws-ebs-csi-driver/releases/tag/v1.66.0
    runtime_verified: false
grafana_charts:
  grafana:
    version: 13.3.1
    app_version: 13.2.3
    source: https://artifacthub.io/packages/helm/grafana-community/grafana
    runtime_verified: false
  loki:
    version: 18.14.0
    app_version: 3.7.8
    source: https://artifacthub.io/packages/helm/grafana-community/loki
    runtime_verified: false
  # The newest chart release that packages the pinned Tempo 3.0.3; 3.8.0 onward ship Tempo 3.1.0.
  # Resolved from https://grafana-community.github.io/helm-charts/index.yaml on 2026-10-10.
  tempo_distributed:
    version: 3.7.2
    app_version: 3.0.3
    source: https://artifacthub.io/packages/helm/grafana-community/tempo-distributed
    runtime_verified: false
  mimir_distributed:
    version: 6.3.0-weekly.415
    app_version: r415-a8adae14
    source: https://artifacthub.io/packages/helm/grafana/mimir-distributed
    runtime_verified: false
    # mimir-distributed has not migrated to grafana-community/helm-charts and
    # currently only publishes weekly pre-release chart versions; no stable
    # tagged release exists as of this pin. Re-verify before promoting
    # runtime_verified, same caveat pattern as the Pyroscope v1/v2 note.
    release_channel: weekly
    app_version_exception:
      reason: >-
        Only weekly pre-release charts are published, and they package a weekly Mimir build
        (r415), not the pinned Mimir 3.2.1 release. Resolve when a stable chart release exists.
  pyroscope:
    version: 2.3.1
    app_version: 2.3.1
    source: https://artifacthub.io/packages/helm/grafana/pyroscope
    runtime_verified: false
collectors:
  alloy:
    version: 1.20.1
    source: https://github.com/grafana/alloy/releases/tag/v1.20.1
    runtime_verified: true
# Images the Compose profile runs or builds on. Digests are the registry manifest digests
# resolved on 2026-10-09; check-pins compares them with docker-compose/.
container_images:
  mimir:
    repository: docker.io/grafana/mimir
    tag: "3.2.1"
    digest: sha256:d42bfba7a8ef82a14b883a4cf235406324aeecae94c85eba000bdaa21aa2f289
  loki:
    repository: docker.io/grafana/loki
    tag: "3.7.8"
    digest: sha256:81a6802ec4bd1b88c564494f06376889ed022998a188826190d26d2754ac2aae
  tempo:
    repository: docker.io/grafana/tempo
    tag: "3.0.3"
    digest: sha256:05321ebf1f191fde34282b3dc86e68f511d489133df7963cd1670a2e1e11b33c
  pyroscope:
    repository: docker.io/grafana/pyroscope
    tag: "2.3.1"
    digest: sha256:718b585ea168a616ca737018dbd1676992db9e5f1084ec4e9cd18f669326f334
  grafana:
    repository: docker.io/grafana/grafana
    tag: "13.2.3"
    digest: sha256:d84563330dc9d2fd2bc096d0fb96021b5319c75bf6ed555566709998e823dec4
  alloy:
    repository: docker.io/grafana/alloy
    tag: "v1.20.1"
    digest: sha256:5133c159d34c7acf37a1b6d91682abcb6b28b2a29bae152ff5cf4753296f956c
  traefik:
    repository: docker.io/library/traefik
    tag: "v3.7.13"
    digest: sha256:3429c14149401de2ac82fc72ddc6a92642332b90deb3012301ff211b9d2d0f18
  seaweedfs:
    repository: docker.io/chrislusf/seaweedfs
    tag: "4.47"
    digest: sha256:f83509b0721dfd8e2e07faf76c0a899f67a8a889c89abe2fa0a5227ba1320362
  python_base:
    repository: docker.io/library/python
    tag: "3.12-slim-bookworm"
    digest: sha256:2ed6491b93cd49272ee6de2b5a38440c3448360322c089fc23e370722d74179d
validation_tools:
  terraform:
    version: 1.13.5
    sha256:
      windows_amd64: 73f97943c93f268ae2c645b2a737d552175aa64d00a5c8b8f5ccc5831c033c8a
      linux_amd64: 0dbe3fcc268eb670801af6a6456799d1ae26e72e73797f6c6167e18aafd1fd9a
      linux_arm64: fc1ddcb403fb57e25bdbdceb1ef2b1a102650c01b4d65dd3410082d2ef8b4417
  aws_provider:
    source: hashicorp/aws
    version: 6.12.0
# Vault is provided by the operator, so this is not an install pin. `supported` is the range of
# server versions the prerequisite check accepts (minimum inclusive, below exclusive); `version`
# and `image` are what the tests run against. The digest is the registry manifest-list digest
# resolved on 2026-10-10.
secrets_store:
  vault:
    version: 2.1.2
    source: https://releases.hashicorp.com/vault/2.1.2/
    runtime_verified: true
    supported:
      minimum: 2.1.2
      below: 2.2.0
    image:
      repository: docker.io/hashicorp/vault
      tag: "2.1.2"
      digest: sha256:c2f666266f383d2cf424d86b8bb8ce7d065562173ffec2b476d762943608bb55
os_support:
  docker_hosts:
    - distribution: ubuntu
      versions: ["22.04", "24.04"]
      architectures: ["amd64", "arm64"]
    - distribution: debian
      versions: ["12"]
      architectures: ["amd64", "arm64"]
  k3s_nodes:
    - distribution: ubuntu
      versions: ["22.04", "24.04"]
      architectures: ["amd64", "arm64"]
tracked_consumers:
  - path: terraform/modules/object-storage/versions.tf
    pattern: 'required_version\s*=\s*"=\s*([0-9.]+)"'
    component: validation_tools.terraform.version
  - path: terraform/modules/object-storage/versions.tf
    pattern: '(?m)^\s*version\s*=\s*"=\s*([0-9.]+)"'
    component: validation_tools.aws_provider.version
  - path: terraform/modules/aws-s3-backends/versions.tf
    pattern: 'required_version\s*=\s*"=\s*([0-9.]+)"'
    component: validation_tools.terraform.version
  - path: terraform/modules/aws-s3-backends/versions.tf
    pattern: '(?m)^\s*version\s*=\s*"=\s*([0-9.]+)"'
    component: validation_tools.aws_provider.version
  - path: terraform/environments/aws-state-bootstrap/versions.tf
    pattern: 'required_version\s*=\s*"=\s*([0-9.]+)"'
    component: validation_tools.terraform.version
  - path: terraform/environments/aws-state-bootstrap/versions.tf
    pattern: '(?m)^\s*version\s*=\s*"=\s*([0-9.]+)"'
    component: validation_tools.aws_provider.version
  - path: terraform/modules/aws-vpc-network/versions.tf
    pattern: 'required_version\s*=\s*"=\s*([0-9.]+)"'
    component: validation_tools.terraform.version
  - path: terraform/modules/aws-vpc-network/versions.tf
    pattern: '(?m)^\s*version\s*=\s*"=\s*([0-9.]+)"'
    component: validation_tools.aws_provider.version
  - path: terraform/modules/aws-eks/versions.tf
    pattern: 'required_version\s*=\s*"=\s*([0-9.]+)"'
    component: validation_tools.terraform.version
  - path: terraform/modules/aws-eks/versions.tf
    pattern: '(?m)^\s*version\s*=\s*"=\s*([0-9.]+)"'
    component: validation_tools.aws_provider.version
  - path: terraform/modules/aws-eks/variables.tf
    pattern: '(?s)variable "cluster_version" \{.*?default\s*=\s*"([0-9.]+)"'
    component: kubernetes_platform.eks.version
  - path: terraform/modules/aws-eks/variables.tf
    pattern: '(?s)variable "ebs_csi_addon_version" \{.*?default\s*=\s*"v([0-9.]+)-eksbuild'
    component: kubernetes_platform.ebs_csi_driver.version
  - path: terraform/environments/aws/versions.tf
    pattern: 'required_version\s*=\s*"=\s*([0-9.]+)"'
    component: validation_tools.terraform.version
  - path: terraform/environments/aws/versions.tf
    pattern: '(?m)^\s*version\s*=\s*"=\s*([0-9.]+)"'
    component: validation_tools.aws_provider.version
  - path: terraform/environments/self-hosted-k8s/main.tf
    pattern: 'required_version\s*=\s*"=\s*([0-9.]+)"'
    component: validation_tools.terraform.version
  - path: terraform/environments/self-hosted-k8s/main.tf
    pattern: '(?m)^\s*version\s*=\s*"=\s*([0-9.]+)"'
    component: validation_tools.aws_provider.version
  - path: terraform/environments/docker/main.tf
    pattern: 'required_version\s*=\s*"=\s*([0-9.]+)"'
    component: validation_tools.terraform.version
  - path: terraform/environments/docker/main.tf
    pattern: '(?m)^\s*version\s*=\s*"=\s*([0-9.]+)"'
    component: validation_tools.aws_provider.version
  - path: alloy-configs/README.md
    pattern: 'Pinned Alloy version: `([0-9.]+)`'
    component: collectors.alloy.version
  - path: docker-compose/docker-compose.yaml
    pattern: 'docker\.io/grafana/mimir:([^@\s]+)@sha256:'
