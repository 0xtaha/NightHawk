  - path: docker-compose/docker-compose.yaml
    pattern: 'docker\.io/grafana/pyroscope:[^@\s]+@(sha256:[0-9a-f]{64})'
    component: container_images.pyroscope.digest
  - path: docker-compose/docker-compose.yaml
    pattern: 'docker\.io/grafana/grafana:([^@\s]+)@sha256:'
    component: container_images.grafana.tag
  - path: docker-compose/docker-compose.yaml
    pattern: 'docker\.io/grafana/grafana:[^@\s]+@(sha256:[0-9a-f]{64})'
    component: container_images.grafana.digest
  - path: docker-compose/docker-compose.yaml
