    version: 1.37.1+k3s1
    source: https://github.com/k3s-io/k3s/releases/tag/v1.37.1%2Bk3s1
    runtime_verified: false
  cilium:
    version: 1.20.2
    source: https://github.com/cilium/cilium/releases/tag/v1.20.2
    runtime_verified: false
  metallb:
