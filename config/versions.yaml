  - path: docker-compose/docker-compose.yaml
    pattern: 'docker\.io/grafana/loki:[^@\s]+@(sha256:[0-9a-f]{64})'
    component: container_images.loki.digest
  - path: docker-compose/docker-compose.yaml
    pattern: 'docker\.io/grafana/tempo:([^@\s]+)@sha256:'
