# Contract example for the self-hosted Kubernetes profile, not deployment configuration.
# Retention values are examples. See docs/08-ansible.md for the cluster and docs/09-kubernetes.md
# for the workloads. `profile: production` selects the distributed, replicated deployment.
schema_version: 2
deployment: self-hosted-k8s
profile: production
vault:
  # The operator's Vault. Credentials are never declared here.
  address: https://vault.example.com:8200
  kv_mount: nighthawk-kv
  pki:
    mount: nighthawk-pki
    server_role: nighthawk-server
    client_role: nighthawk-collector
  # Where the cluster's service accounts authenticate. Workloads read their secrets through it,
  # read-only; no Vault credential is stored in the cluster.
  kubernetes_auth:
    mount: nighthawk-k8s
gateway:
  hostname: gateway.nighthawk.internal
  # In-cluster collectors, Grafana, and collectors outside the cluster with a client certificate.
  entry_points: [cluster-gateway, grafana-gateway, remote-gateway]
  grafana_entry_point: grafana-gateway
  auth_service: http://authz.nighthawk.svc:9180
  upstreams:
    grafana: http://grafana.nighthawk.svc:3000
    metrics: http://mimir.nighthawk.svc:8080
    logs: http://loki.nighthawk.svc:3100
    traces:
      query: http://tempo.nighthawk.svc:3200
      otlp_grpc: h2c://tempo.nighthawk.svc:4317
      otlp_http: http://tempo.nighthawk.svc:4318
    profiles: http://pyroscope.nighthawk.svc:4040
  revoked_certificate_fingerprints: []
grafana:
  hostname: grafana.nighthawk.internal
  admin_secret_ref: grafana-admin
storage:
  provider: seaweedfs
  bindings:
    mimir-blocks: &mimir-binding
      protocol: s3
      endpoint: https://seaweedfs:8333
      region: local
      bucket: nighthawk-mimir-blocks
      force_path_style: true
      tls:
        enabled: true
        trust: pki
        ca_secret_ref: null
      identity:
        type: secret
        ref: mimir-storage
      capabilities:
        versioning: false
        lifecycle: false
        workload_identity: false
    mimir-ruler:
      <<: *mimir-binding
      bucket: nighthawk-mimir-ruler
    mimir-alertmanager:
      <<: *mimir-binding
      bucket: nighthawk-mimir-alertmanager
    loki-chunks:
      <<: *mimir-binding
      bucket: nighthawk-loki-chunks
      identity:
        type: secret
        ref: loki-storage
    tempo-traces:
      <<: *mimir-binding
      bucket: nighthawk-tempo-traces
      identity:
        type: secret
        ref: tempo-storage
    pyroscope-profiles:
      <<: *mimir-binding
      bucket: nighthawk-pyroscope-profiles
      identity:
        type: secret
        ref: pyroscope-storage
cluster:
  # Generated once by `generate-cluster-token`; copied to nodes as a file by the k3s_node role.
  join_token_secret_ref: cluster-join-token
# A workload's Vault policy covers a whole path, so secrets read by different workloads have
# different paths. One path per secret is the simplest layout that satisfies that.
secrets:
  cluster-join-token: {path: nighthawk/cluster, key: join-token}
  mimir-storage: {path: nighthawk/self-hosted/mimir-storage, key: value}
  loki-storage: {path: nighthawk/self-hosted/loki-storage, key: value}
  tempo-storage: {path: nighthawk/self-hosted/tempo-storage, key: value}
  pyroscope-storage: {path: nighthawk/self-hosted/pyroscope-storage, key: value}
  grafana-admin: {path: nighthawk/self-hosted/grafana-admin, key: value}
  example-ingest: {path: nighthawk/self-hosted/example-ingest, key: value}
  example-query: {path: nighthawk/self-hosted/example-query, key: value}
credentials:
  - id: example-ingest
    secret_ref: example-ingest
    tenant: example
    datastream: application
    permission: ingest
    certificate_identity: spiffe://nighthawk/example/application/collector
  - id: example-query
    secret_ref: example-query
    tenant: example
    datastream: application
    permission: query
tenants:
  - id: example
    datastreams:
      - id: application
        backend_id: example-application
        signals:
          metrics:
            retention: 168h
            ingestion_rate_samples_per_second: 10000
            query_concurrency: 4
          logs:
            retention: 72h
            ingestion_rate_bytes_per_second: 1048576
            query_concurrency: 4
          traces:
            retention: 72h
            ingestion_rate_bytes_per_second: 1048576
            query_concurrency: 4
          profiles:
            retention: 168h
            ingestion_rate_bytes_per_second: 1048576
            query_concurrency: 4
        collection:
          approved: true
          drop_fields: [password, authorization, cookie, email]
          allow_privileged_profiling: false
