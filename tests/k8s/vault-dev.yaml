# Test fixture only: a throwaway dev-mode Vault inside the acceptance cluster. An operator's
# Vault is never deployed by the platform. The root token below protects nothing; it exists
# for as long as the test cluster does.
apiVersion: v1
kind: Namespace
metadata:
  name: vault-dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault-dev
---
# Lets this Vault ask the cluster whether a service account token is genuine.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-dev-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault-dev
spec:
  replicas: 1
  selector:
    matchLabels: {app: vault}
  template:
    metadata:
      labels: {app: vault}
    spec:
      serviceAccountName: vault
      containers:
        - name: vault
          image: docker.io/hashicorp/vault:2.1.2
          imagePullPolicy: IfNotPresent
          args: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              value: nighthawk-k8s-e2e-dev-root
          ports:
            - containerPort: 8200
          readinessProbe:
            httpGet: {path: /v1/sys/health, port: 8200}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault-dev
spec:
  selector: {app: vault}
  ports:
    - port: 8200
      targetPort: 8200
