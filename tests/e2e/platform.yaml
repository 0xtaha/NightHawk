# End-to-end test document: two customers with two datastreams each.
# acme/batch enables only metrics and logs; globex/edge has a certificate-bound collector.
# Retention values are test values, not production defaults.
schema_version: 2
deployment: docker
profile: development
vault:
  # The end-to-end suite starts its own dev-mode Vault and replaces this address with that one.
  address: http://127.0.0.1:8200
  kv_mount: nighthawk-kv
  pki:
    mount: nighthawk-pki
    server_role: nighthawk-server
    client_role: nighthawk-collector
gateway:
  hostname: gateway.nighthawk.internal
  entry_points:
  - local-gateway
  - grafana-gateway
  # Listens in the gateway container always; published only by the case that adds the override.
  - remote-gateway
  grafana_entry_point: grafana-gateway
  auth_service: http://authz:9180
  upstreams:
    grafana: http://grafana:3000
    metrics: http://mimir:8080
    logs: http://loki:3100
    traces:
      query: http://tempo:3200
      otlp_grpc: h2c://tempo:4317
      otlp_http: http://tempo:4318
    profiles: http://pyroscope:4040
  revoked_certificate_fingerprints: []
grafana:
  hostname: grafana.nighthawk.internal
  admin_secret_ref: grafana-admin
storage:
  provider: seaweedfs
  bindings:
    mimir-blocks:
      protocol: s3
      endpoint: https://seaweedfs:8333
      region: local
      bucket: nighthawk-mimir-blocks
      force_path_style: true
      tls: &id001
        enabled: true
        trust: pki
        ca_secret_ref: null
      identity: &id002
        type: secret
        ref: mimir-storage
      capabilities: &id003
        versioning: false
        lifecycle: false
        workload_identity: false
    mimir-ruler:
      protocol: s3
      endpoint: https://seaweedfs:8333
      region: local
      bucket: nighthawk-mimir-ruler
      force_path_style: true
      tls: *id001
      identity: *id002
      capabilities: *id003
    mimir-alertmanager:
      protocol: s3
      endpoint: https://seaweedfs:8333
      region: local
      bucket: nighthawk-mimir-alertmanager
      force_path_style: true
      tls: *id001
      identity: *id002
      capabilities: *id003
    loki-chunks:
      protocol: s3
      endpoint: https://seaweedfs:8333
      region: local
      bucket: nighthawk-loki-chunks
      force_path_style: true
      tls: *id001
      identity:
        type: secret
        ref: loki-storage
      capabilities: *id003
    tempo-traces:
      protocol: s3
      endpoint: https://seaweedfs:8333
      region: local
      bucket: nighthawk-tempo-traces
      force_path_style: true
      tls: *id001
      identity:
        type: secret
        ref: tempo-storage
      capabilities: *id003
    pyroscope-profiles:
      protocol: s3
      endpoint: https://seaweedfs:8333
      region: local
      bucket: nighthawk-pyroscope-profiles
      force_path_style: true
      tls: *id001
      identity:
        type: secret
        ref: pyroscope-storage
      capabilities: *id003
secrets:
  mimir-storage:
    path: nighthawk/e2e
    key: mimir-storage
  loki-storage:
    path: nighthawk/e2e
    key: loki-storage
  tempo-storage:
    path: nighthawk/e2e
    key: tempo-storage
  pyroscope-storage:
    path: nighthawk/e2e
    key: pyroscope-storage
  grafana-admin:
    path: nighthawk/e2e
    key: grafana-admin
  acme-web-ingest:
    path: nighthawk/e2e
    key: acme-web-ingest
  acme-web-query:
    path: nighthawk/e2e
    key: acme-web-query
  acme-batch-ingest:
    path: nighthawk/e2e
    key: acme-batch-ingest
  acme-batch-query:
    path: nighthawk/e2e
    key: acme-batch-query
  globex-web-ingest:
    path: nighthawk/e2e
    key: globex-web-ingest
  globex-web-query:
    path: nighthawk/e2e
    key: globex-web-query
  globex-edge-ingest:
    path: nighthawk/e2e
    key: globex-edge-ingest
  globex-edge-query:
    path: nighthawk/e2e
    key: globex-edge-query
credentials:
- id: acme-web-ingest
  secret_ref: acme-web-ingest
  tenant: acme
  datastream: web
  permission: ingest
- id: acme-web-query
  secret_ref: acme-web-query
  tenant: acme
  datastream: web
  permission: query
- id: acme-batch-ingest
  secret_ref: acme-batch-ingest
  tenant: acme
  datastream: batch
  permission: ingest
- id: acme-batch-query
  secret_ref: acme-batch-query
  tenant: acme
  datastream: batch
  permission: query
- id: globex-web-ingest
  secret_ref: globex-web-ingest
  tenant: globex
  datastream: web
  permission: ingest
- id: globex-web-query
  secret_ref: globex-web-query
  tenant: globex
  datastream: web
  permission: query
- id: globex-edge-ingest
  secret_ref: globex-edge-ingest
  tenant: globex
  datastream: edge
  permission: ingest
  certificate_identity: spiffe://nighthawk/globex/edge/collector
- id: globex-edge-query
  secret_ref: globex-edge-query
  tenant: globex
  datastream: edge
  permission: query
tenants:
- id: acme
  datastreams:
  - id: web
    backend_id: acme-web
    # Each signal has its own retention, so the suite can tell them apart per backend.
    signals:
      metrics:
        retention: 168h
        ingestion_rate_samples_per_second: 10000
        query_concurrency: 4
      logs:
        retention: 240h
        ingestion_rate_bytes_per_second: 1048576
        query_concurrency: 4
      traces:
        retention: 120h
        ingestion_rate_bytes_per_second: 1048576
        query_concurrency: 4
      profiles:
        retention: 72h
        ingestion_rate_bytes_per_second: 1048576
        query_concurrency: 4
    collection:
      approved: true
      drop_fields:
      - password
      - authorization
      - cookie
      - email
      # Has a separator: arrives as the label `user_email` in the profile pipeline.
      - user.email
      allow_privileged_profiling: false
  - id: batch
    backend_id: acme-batch
    signals:
      metrics:
        retention: 72h
        ingestion_rate_samples_per_second: 10000
        query_concurrency: 4
      logs:
        retention: 72h
        ingestion_rate_bytes_per_second: 1048576
        query_concurrency: 4
    collection:
      approved: true
      drop_fields:
      - password
      - authorization
      - cookie
      - email
      allow_privileged_profiling: false
- id: globex
  datastreams:
  - id: web
    backend_id: globex-web
    signals:
      metrics:
        retention: 96h
        ingestion_rate_samples_per_second: 10000
        query_concurrency: 4
      logs:
        retention: 96h
        ingestion_rate_bytes_per_second: 1048576
        query_concurrency: 4
      traces:
        retention: 96h
        ingestion_rate_bytes_per_second: 1048576
        query_concurrency: 4
      profiles:
        retention: 96h
        ingestion_rate_bytes_per_second: 1048576
        query_concurrency: 4
    collection:
      approved: true
      drop_fields:
      - password
      - authorization
      - cookie
      - email
      allow_privileged_profiling: false
  - id: edge
    backend_id: globex-edge
    signals:
      metrics:
        retention: 48h
        ingestion_rate_samples_per_second: 10000
        query_concurrency: 4
      logs:
        retention: 48h
        ingestion_rate_bytes_per_second: 1048576
        query_concurrency: 4
      traces:
        retention: 48h
        ingestion_rate_bytes_per_second: 1048576
        query_concurrency: 4
      profiles:
        retention: 48h
        ingestion_rate_bytes_per_second: 1048576
        query_concurrency: 4
    collection:
      approved: true
      drop_fields:
      - password
      - authorization
      - cookie
      - email
      allow_privileged_profiling: false
